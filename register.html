<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Musik dan Kreativitas</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <header>
        <h1 style="font-family: arial black;">REGISTER</h1>
        <nav>
            <img>
            <a href="index.html" style="font-family : arial black;">Beranda</a> |
            <a href="login.html" style="font-family : arial black;">Login</a>
        </nav>
    </header>
    <main>
        <form action="#" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="NamaLengkap">Nama Lengkap:</label>
            <input type="text" id="NamaLengkap" name="NamaLengkap" required>
            <label for="Usia">Usia:</label>
            <input type="number" id="Usia" name="Usia" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <label for="confirm_password">Konfirmasi Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
            <button type="submit">Register</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 | Maryo Melandry Loppies</p>
    </footer>
</body>
</html>
